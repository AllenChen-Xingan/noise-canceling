[package]
name = "vdn-polish"
description = "修音链：降噪之后的零前瞻修整——频谱平滑（金属声 / 音乐噪声）· 衰减下限 + 舒适噪声（真空感）· 去发闷均衡 · AGC 与限幅（忽大忽小）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vdn-types.workspace = true
vdn-dsp = { path = "../dsp" }
realfft = "3.5"

[dev-dependencies]
assert_no_alloc = "1.1"
hound = "3.5"

[lints]
workspace = true

[package.metadata.vdn]
tier = "B"
unsafe = false
forbid = ["ort", "hound", "serde", "serde_json", "cpal", "coreaudio-rs"]
