[package]
name = "vdn-speaker"
description = "认出你的声音：VAD、fbank、声纹、零设置注册、不对称门控（P2 离线）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# 默认什么都不带：核心只依赖 dsp + earshot + realfft（规约 §2.2 规则 1）
default = []
# 声纹模型（ort）。过渡期例外：拆出推理后端 crate 后移走（同 vdn-models 的 ort 例外）
onnx = ["dep:ort"]
# 离线实验命令行 vdn-speaker（读写 WAV、跑 GTCRN）。待迁移到 vdn-cli / vdn-eval（规约 §2.1 离线层）
offline = ["onnx", "dep:vdn-engine", "dep:vdn-models", "dep:hound", "dep:serde_json"]

[dependencies]
# 本 crate 新引入的依赖
earshot = "=1.2.2"
# 以下沿用 workspace 的唯一一份钉
realfft.workspace = true
vdn-dsp.workspace = true
ort = { workspace = true, optional = true }
vdn-engine = { workspace = true, optional = true }
vdn-models = { workspace = true, optional = true }
hound = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
assert_no_alloc.workspace = true

[[bin]]
name = "vdn-speaker"
path = "src/bin/vdn-speaker.rs"
required-features = ["offline"]

# 机读正本（规约 §5.4）：核心档；实时 Stage（envelope / gate / vad）跑在降噪线程，按 B 档要求写
[package.metadata.vdn]
tier = "core"
unsafe = false
forbid = ["hound", "serde", "serde_json", "vdn-engine", "vdn-models", "cpal"]
forbid_note = "以上只允许经 offline feature 进入（离线实验命令行）；ort 只经 onnx feature"

[lints]
workspace = true
