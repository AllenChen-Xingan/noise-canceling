[package]
name = "vdn-dsp"
description = "纯信号处理积木：STFT/iSTFT、延迟线、包络、交叉淡化。不依赖模型、不做 I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
realfft.workspace = true

[dev-dependencies]
assert_no_alloc.workspace = true

[lints]
workspace = true

# 机读正本（specs/rust/architecture.md §5.4）。unsafe = true 只为 src/ftz.rs（FTZ 守卫读写浮点控制寄存器，R9 / R10）
[package.metadata.vdn]
tier = "B"
unsafe = true
forbid = ["ort", "hound", "serde", "serde_json", "cpal", "clap", "vdn-engine", "vdn-models", "coreaudio-rs", "coreaudio-sys", "objc2"]
