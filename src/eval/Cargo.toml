[package]
name = "vdn-eval"
description = "评测：verifier（CI 层纯 DSP · QA 层要模型）、任务集（回归 / 能力 / 防作弊探针）、定标、报告。和实时走同一份处理代码（vdn-engine + vdn-dsp）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "vdn-eval"
path = "src/main.rs"

[dependencies]
vdn-types.workspace = true
vdn-dsp.workspace = true
vdn-engine.workspace = true
vdn-models.workspace = true
# DNSMOS（QA 层）。拆出 vdn-backend-ort 后改走后端（specs/rust/architecture.md §2.3）
ort.workspace = true
hound.workspace = true
# ESTOI 的 STFT（f64，照 pystoi 口径）
serde_json.workspace = true
serde.workspace = true
# 清单文件格式派生 JSON Schema（specs/schema/eval-*.schema.json，由 vdn-schema 导出）
schemars.workspace = true

[lints]
workspace = true

# 机读正本（specs/rust/architecture.md §5.4）。离线评测工具：C 档
[package.metadata.vdn]
tier = "C"
unsafe = false
forbid = ["cpal", "coreaudio-rs", "coreaudio-sys", "objc2"]
