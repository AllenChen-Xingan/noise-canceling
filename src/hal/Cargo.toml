[package]
name = "vdn-hal"
description = "自有虚拟麦克风（Core Audio HAL 插件，D55 用 Rust 写）。本批只有读出端 HalSource 与插件外壳：工厂函数返回空指针 = 不加载"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib：将来打进 .driver 包给 coreaudiod 加载；rlib：给测试和 vdn-capture 用
crate-type = ["cdylib", "rlib"]

[dependencies]

[dev-dependencies]
assert_no_alloc.workspace = true

[lints]
workspace = true

# 机读正本（specs/rust/architecture.md §5.4）
# unsafe = true：CFPlugIn 工厂函数要 #[unsafe(no_mangle)] 导出 C 符号；真驱动接口（D05）要 FFI
[package.metadata.vdn]
tier = "A"
unsafe = true
forbid = ["cpal", "coreaudio-rs", "ort", "hound", "serde", "serde_json", "clap", "vdn-engine", "vdn-models", "vdn-backend-ort", "vdn-io-macos"]
