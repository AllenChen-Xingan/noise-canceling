# 闸门（macOS 平台部分）：`cargo run -p xtask -- ci --platform macos`
# = clippy --target aarch64-apple-darwin + 测试，只针对 vdn-io-macos · vdn-shm · vdn-rt-thread · vdn-hal。
# 只在这些 crate、依赖锁或本文件改动时触发（规约 §7「CI 费用」）。
# 注意：若在仓库设置里把本 job 设成「必须通过」，不触发的 PR 会一直等它；按路径触发的 job 别设成必过。
name: ci-macos
on:
  pull_request:
    paths:
      - "src/io-macos/**"
      - "src/shm/**"
      - "src/rt-thread/**"
      - "src/hal/**"
      - "src/xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - ".github/workflows/ci-macos.yml"
  push:
    branches: [main]
    paths:
      - "src/io-macos/**"
      - "src/shm/**"
      - "src/rt-thread/**"
      - "src/hal/**"
      - "src/xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - ".github/workflows/ci-macos.yml"
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: rust gate (macos)
        run: cargo run -p xtask -- ci --platform macos
