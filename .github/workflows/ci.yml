# 闸门：本机与 CI 共用一条命令 `cargo run -p xtask -- ci`（fmt · clippy · test · tidy · check-deps；cargo-deny 装了才跑）。
# 本批全在 macOS 上跑；按规约 §7「CI 费用」把核心 crate 拆到 Linux、macOS 只跑平台部分，后续批次做。
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: manifests
        run: python3 scripts/check-manifests.py
      - name: rust gate
        run: cargo run -p xtask -- ci
      - name: eval ci
        # CI 层评测：纯 DSP、确定性、无模型权重；回归集 L3 不过 / 比冻结基线差 / 探针没抓住 → 失败（exp007）
        run: |
          if [ ! -f src/eval/Cargo.toml ]; then echo "no vdn-eval yet, skip"; exit 0; fi
          cargo run -p xtask -- eval ci
