# vdn workspace：crate 放 src/<crate>/。依赖方向见 specs/rust/architecture.md §2.2：types ← dsp ← engine；models → types + dsp；cli → engine + models；xtask 不依赖任何 vdn crate
[workspace]
resolver = "3"
members = ["src/dsp", "src/engine", "src/models", "src/cli", "src/types", "src/xtask", "src/speaker", "src/speaker-lab", "src/scene", "src/polish", "src/eval", "src/backend-ort", "src/io-macos", "src/hal", "src/shm", "src/rt-thread", "src/control", "src/capture", "src/denoised"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.92"
publish = false

[workspace.dependencies]
vdn-types = { path = "src/types" }
vdn-dsp = { path = "src/dsp" }
vdn-engine = { path = "src/engine" }
vdn-models = { path = "src/models" }
vdn-control = { path = "src/control" }
vdn-capture = { path = "src/capture" }
vdn-denoised = { path = "src/denoised" }
vdn-shm = { path = "src/shm" }
vdn-rt-thread = { path = "src/rt-thread" }
vdn-backend-ort = { path = "src/backend-ort" }
realfft = "3.5"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }
hound = "3.5"
clap = { version = "4", features = ["derive"] }
assert_no_alloc = "1.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# termination：SIGTERM / SIGHUP 也走同一个处理（降噪进程退出前要删共享内存名）
ctrlc = { version = "3.4", features = ["termination"] }
# 实时线程间的单生产者单消费者队列（009 推荐；MIT OR Apache-2.0）：换总线交接、控制命令
rtrb = "0.4"
stats_alloc = "0.1"
cpal = "0.18.2"
vdn-io-macos = { path = "src/io-macos" }
vdn-hal = { path = "src/hal" }
libc = "0.2"
mach2 = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# 禁用清单（根 clippy.toml）默认放行，只在实时 impl 块 / 实时模块上升为 deny（specs/rust/architecture.md §5.3）
disallowed_methods = "allow"
disallowed_types = "allow"
disallowed_macros = "allow"
undocumented_unsafe_blocks = "deny"
