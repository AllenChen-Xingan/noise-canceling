# exp025 数据消融的**运行矩阵**（#212 · 014 第 4 步）：2 个基线 + 4 个关旋钮 + 1 个开 high_snr，共 7 个运行。
# 配置正本见 configs/ablation.yaml（base）；每批 3 个同时跑一张 H100（7 个 = 3 + 3 + 1，分批在 ablation.py 里算）。
# 开训前 `python ablation.py check` 必须通过：它查 base 里的 TODO 占位、data_build 与 5 份变体配方的
# 登记记录、运行集合是不是这 7 个、以及每个变体配方是不是从基线配方只改了一个开关。
base: ablation.yaml
# 第五批基线 build（traindata 登记）：check 拿配方与数据代码的 sha256 对它的登记记录（data/builds/<id>/build.json）
data_build: df759bb8d606a209
# 变体配方目录（traindata 写）：相对 trainer/。每个变体只改 一个旋钮的 on，并带顶层 _ablation 记明出处。
variants_dir: ../data/recipes/ablation
# name · seed · knob（基线写 null）· "on"（这个旋钮在变体里应该是什么值）
# ⚠️ on 必须加引号：YAML 1.1 把裸写的 on 读成 true，那个键就不再叫 on 了。
runs:
  - {name: abl-base-s0, seed: 0, knob: null, "on": null}   # 基线：两个种子的差 = 噪声底（floor）
  - {name: abl-base-s1, seed: 1, knob: null, "on": null}
  - {name: abl-eq-off, seed: 0, knob: eq, "on": false}
  - {name: abl-clip-off, seed: 0, knob: clip, "on": false}
  - {name: abl-n_noises-off, seed: 0, knob: n_noises, "on": false}
  - {name: abl-reverb-off, seed: 0, knob: reverb, "on": false}
  - {name: abl-high_snr-on, seed: 0, knob: high_snr, "on": true}
