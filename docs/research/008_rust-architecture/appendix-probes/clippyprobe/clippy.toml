disallowed-macros = [
  { path = "std::println", reason = "RT: no IO" },
  { path = "std::format", reason = "RT: allocates" },
  { path = "std::vec", reason = "RT: allocates" },
]
disallowed-methods = [
  { path = "alloc::vec::Vec::push", reason = "RT: no growth" },
  { path = "std::vec::Vec::reserve", reason = "std path variant" },
  { path = "alloc::boxed::Box::new", reason = "RT: allocates" },
]
disallowed-types = [ { path = "std::sync::Mutex", reason = "RT: no locks" } ]
